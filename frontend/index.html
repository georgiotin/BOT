<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- T-fix-header-color (2026-08-15): theme-color в #0a0a0b. Раньше был
         #0a0a0b (slate-900) — TG-клиент перекрашивал шапку в синий, и она
         контрастировала с #0a0a0b в StealthLayout. Теперь совпадает с
         body — везде один чёрный. -->
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="Личный кабинет и админка VPN на базе Remnawave" />
    <style>
      /* T-white-flash-fix (2026-08-13): без этого браузер красит страницу в
         белый ДО загрузки CSS-бандла — на медленном интернете внутри Telegram
         это давало заметную белую вспышку перед тёмной темой Stealth.
         T-fix-header-color (2026-08-15): сменили с #0a0a0b на #0a0a0b —
         TG рисует первые кадры по inline-стилю, и теперь он матчится
         со StealthLayout + Telegram-шапкой (после setHeaderColor). */
      html, body { background-color: #0a0a0b; }
      #root { min-height: 100vh; }
    </style>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AspectVPN" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AspectVPN" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=latin,cyrillic"
      rel="stylesheet"
    />
    <title>AspectVPN</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Если старый Service Worker перехватил запрос к /api/ и вернул SPA —
      // удаляем SW и перезагружаем, чтобы запрос ушёл на бэкенд.
      if (location.pathname.startsWith('/api/')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var p = [];
            regs.forEach(function(r) { p.push(r.unregister()); });
            Promise.all(p).then(function() { location.reload(); });
          });
        } else {
          location.reload();
        }
      }
    </script>
    <script src="/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
